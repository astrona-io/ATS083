# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# IPAM In The CNI Plugin (Playground). Ungraded sandbox: no task, no submit.
apiVersion: astrona.io/v1
metadata:
  name: ats-083-playground-020-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: seed-environment
    description: "Two-node kind cluster with flannel, plus the `probe` Service, the `shuttle` pod, the `drifter` pod and a Deployment `crew` with four pods."
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
