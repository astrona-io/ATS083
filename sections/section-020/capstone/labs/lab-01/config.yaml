# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# IPAM Capstone (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-083-lab-020-cap
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: seed-environment
    description: "Two-node kind cluster with flannel and the example workloads. No report and no `latecomer` pod exist."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: node-cidrs-recorded
    description: "The report holds the live pod CIDR of each node"
    type: file
    source: validation/validate-node-cidrs-recorded.sh
    hint: "Read spec.podCIDR of the control-plane node and of the worker node."
  - name: pods-outside-ranges-recorded
    description: "The report holds the live number of pods outside the range of their node"
    type: file
    source: validation/validate-pods-outside-ranges-recorded.sh
    hint: "Compare the first three octets of each pod address with the pod CIDR of its node. Skip pods that use the host network."
  - name: latecomer-placed
    description: "The pod latecomer runs on the worker node with an address inside its range"
    type: file
    source: validation/validate-latecomer-placed.sh
    hint: "Use a nodeSelector with kubernetes.io/hostname set to the worker node name."
teardown:
  keepCluster: false
