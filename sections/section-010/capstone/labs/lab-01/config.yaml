# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
# CNI Installation Capstone (LAB). UNTESTED: static checks only. Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-083-lab-010-cap
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
bootstrap:
  init:
  - name: seed-environment
    description: "Two-node kind cluster with the reference CNI plugins on every node and no network plugin. The nodes are NotReady and no workloads exist."
    type: file
    source: bootstrap/setup.sh
testing:
  init:
  - name: apply-reference-solution
    description: Apply the reference solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: flannel-installed
    description: "flannel runs on every node with the pinned image and the nodes are Ready"
    type: file
    source: validation/validate-flannel-installed.sh
    hint: "Apply the manifest of flannel v0.28.10 without editing it and wait for the nodes."
  - name: conf-file-recorded
    description: "The report names the file that flannel writes into the CNI configuration directory"
    type: file
    source: validation/validate-conf-file-recorded.sh
    hint: "Read the last argument of the init container install-cni and keep only the file name."
  - name: backend-recorded
    description: "The report holds the backend type from the flannel network configuration"
    type: file
    source: validation/validate-backend-recorded.sh
    hint: "Read the key net-conf.json of the ConfigMap kube-flannel-cfg and take Backend.Type."
  - name: ready-nodes-recorded
    description: "The report holds the live number of Ready nodes"
    type: file
    source: validation/validate-ready-nodes-recorded.sh
    hint: "Count the nodes whose Ready condition is True."
  - name: probe-a-ready
    description: "The pod probe-a in default is Ready and has an address from the pod network"
    type: file
    source: validation/validate-probe-a-ready.sh
    hint: "Run podinfo ghcr.io/stefanprodan/podinfo:6.15.0 as a pod named probe-a in default and wait for it."
teardown:
  keepCluster: false
