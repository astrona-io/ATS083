  title: 'CKNE: Core Infrastructure and CNI'
  description: 'Reading material, labs, playgrounds and knowledge checks for CKNE: Core Infrastructure and CNI. Technical content is draft, and the labs have not been run yet.'
  certification:
    name: Certified Kubernetes Network Engineer
    code: CKNE
    provider: CNCF / Linux Foundation
    domain: Core Infrastructure and CNI
    weight: 15
    competencies:
    - Installing and Configuring CNI Plugins
    - Managing IPAM and Pod CIDR Allocation
